version: '3.8'
name: hb-vibe-system
networks:
  hb_vibe_network:
    driver: bridge

services:
  # ==========================================
  # 1. USER SERVICE DATABASE
  # ==========================================
  user-db:
    image: postgres:15
    container_name: hb_vibe_postgres
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5434:5432" # Ánh xạ ra port 5434 trên máy thật để code Spring Boot kết nối
    networks:
      - hb_vibe_network
    restart: unless-stopped

  # ==========================================
  # 2. KEYCLOAK (AUTH & IDENTITY)
  # ==========================================
  keycloak-db:
    image: postgres:15
    container_name: hb_keycloak_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - hb_vibe_network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: hb_keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080" # Truy cập giao diện quản trị tại localhost:8080
    depends_on:
      - keycloak-db
    networks:
      - hb_vibe_network
    restart: unless-stopped

  # ==========================================
  # 3. KONG API GATEWAY (Chế độ DB-less)
  # ==========================================
  kong:
    image: kong:3.4.0
    container_name: hb_kong_gateway
    environment:
      KONG_DATABASE: "off" # Tắt database
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml" # Chỉ định đường dẫn đọc file
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8000:8000" # Port cho Frontend gọi API vào
      - "8443:8443"
      - "8001:8001" # Port Admin API
    volumes:
      - ./kong.yml:/etc/kong/kong.yml # Đẩy file từ máy tính vào trong Docker
    networks:
      - hb_vibe_network
    restart: unless-stopped

    # ==========================================
    # 4. NOTIFICATION SERVICE DATABASE (MongoDB)
    # ==========================================
  notification-db:
      image: mongo:6.0
      container_name: hb_notification_db
      environment:
        MONGO_INITDB_ROOT_USERNAME: admin
        MONGO_INITDB_ROOT_PASSWORD: adminpassword
      ports:
        - "27017:27017"
      networks:
        - hb_vibe_network
      restart: unless-stopped

    # ==========================================
    # 5. KAFKA MESSAGE BROKER (Chế độ KRaft - Không cần Zookeeper)
    # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: hb_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Định nghĩa các cổng lắng nghe: 29092 cho nội bộ Docker, 9092 cho máy thật (Spring Boot)
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # BỔ SUNG 3 DÒNG NÀY ĐỂ FIX LỖI 1 BROKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - hb_vibe_network
    restart: unless-stopped

  # ==========================================
  # 6. REDIS (CACHE CHO PRODUCT & CART)
  # ==========================================
  redis:
    image: redis:alpine
    container_name: hb_vibe_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hb_vibe_network
    restart: unless-stopped

  # ==========================================
  # 7. MINIO (OBJECT STORAGE LƯU ẢNH)
  # ==========================================
  minio:
    image: minio/minio
    container_name: hb_vibe_minio
    ports:
      - "9000:9000" # Port API cho Spring Boot gọi
      - "9001:9001" # Port giao diện web Console
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin12345
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - hb_vibe_network
    restart: unless-stopped

# KHAI BÁO VOLUME LƯU TRỮ TRÁNH MẤT DATA KHI TẮT MÁY
volumes:
  redis_data:
  minio_data: