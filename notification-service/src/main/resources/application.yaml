server:
  port: 8082
  servlet:
    context-path: /notification
spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://admin:adminpassword@localhost:27017/notification-service?authSource=admin

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
#      group-id: notification-group-test-v2
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/HBvibe_Web

  notification:
    email:
      brevo-url: https://api.brevo.com
      brevo-apikey: ${BREVO_API_KEY}